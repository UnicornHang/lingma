[tool.poetry]
name = "zhimeng-backend"
version = "0.1.0"
description = "ZhiMeng Novel Studio Backend - AI Agent platform for novel creation"
authors = ["ZhiMeng Team <team@zhimeng.io>"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
# Web framework
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.9"

# Data validation
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"

# Database
sqlalchemy = "^2.0.27"
alembic = "^1.13.1"
aiosqlite = "^0.20.0"

# LLM
litellm = "^1.40.0"
langchain = "^0.3.0"
langgraph = "^1.0.0"

# Vector store
chromadb = "^0.4.22"

# Embeddings (local)
sentence-transformers = "^2.6.0"

# Auth & Crypto
cryptography = "^42.0.0"

# Task queue
arq = "^0.25.0"
redis = "^5.0.0"

# File parsing
python-docx = "^1.1.0"
ebooklib = "^0.18"

# HTTP client
httpx = "^0.27.0"

# Logging
structlog = "^24.1.0"

# Utilities
python-jose = "^3.3.0"
tenacity = "^8.2.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"

# Code quality
mypy = "^1.8.0"
ruff = "^0.3.0"
black = "^24.1.0"

# Pre-commit
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"